apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloud-virt
  labels:
    app: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Evict pods after 30s instead of the default 300s when a node becomes
      # NotReady or Unreachable. Speeds up recovery on node failure.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # Spread replicas across nodes so a single node failure cannot take
      # down all worker pods at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: worker
      containers:
        - name: worker
          image: ghcr.io/j33r0/projet-cloud-virt/api:latest
          command: ["uv", "run", "--no-dev", "celery", "--app", "image_api.worker.app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"