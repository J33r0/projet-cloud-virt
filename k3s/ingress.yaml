---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    service:
      type: ClusterIP
    ports:
      web:
        port: 8081
        exposedPort: 8081
        hostPort: 8081      # bind to host port so VIP traffic and keepalived /ping reach Traefik
      # Disable the default websecure port
      websecure:
        expose:
          default: false
    # Enable Traefik's /ping endpoint so keepalived's health check works
    ping:
      enabled: true
      entryPoint: web

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: cloud-virt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cloud-virt-strip-api-prefix@kubernetescrd
spec:
  rules:
    - host: "herdoiza.maurice-cloud.fr"
      http:
        paths:
          - path: /image
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
# Middleware to strip /api prefix before forwarding to the Flask backend
# Without this, a request to /api/image would arrive at Flask as /api/image
# but Flask expects /image
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: cloud-virt
spec:
  stripPrefix:
    prefixes:
      - /api