---
- name: Rolling upgrade of k3s
  hosts: k3s_cluster
  become: true
  serial: 1
  gather_facts: true

  tasks:
    - name: Cordon node (stop scheduling new pods)
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_primary'][0] }}"
      changed_when: true

    - name: Drain node (evict existing pods to other nodes)
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --force --timeout=300s
      delegate_to: "{{ groups['k3s_primary'][0] }}"
      changed_when: true

    - name: Re-run k3s installer with new version
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION='{{ k3s_version }}' \
          INSTALL_K3S_SKIP_START=true \
          sh -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restart k3s service
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true

    - name: Wait for node to be Ready again
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }} --timeout=300s
      delegate_to: "{{ groups['k3s_primary'][0] }}"
      changed_when: false

    - name: Uncordon node (allow scheduling again)
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_primary'][0] }}"
      changed_when: true
