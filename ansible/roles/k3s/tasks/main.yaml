---
- name: Ensure auto-apply manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['k3s_primary']

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s on primary (cluster-init)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      K3S_TOKEN='{{ k3s_token }}' \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      INSTALL_K3S_EXEC="server --cluster-init --disable=servicelb --write-kubeconfig-mode=644 --tls-san={{ floating_ip }} --node-ip={{ ansible_default_ipv4.address }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when:
    - inventory_hostname in groups['k3s_primary']
    - not k3s_binary.stat.exists

- name: Wait for primary API to be reachable
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['k3s_primary'][0]]['ansible_default_ipv4']['address'] }}"
    port: 6443
    timeout: 180
  when: inventory_hostname in groups['k3s_secondary']

- name: Install k3s on secondaries (join)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      K3S_TOKEN='{{ k3s_token }}' \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      INSTALL_K3S_EXEC="server --server=https://{{ hostvars[groups['k3s_primary'][0]]['ansible_default_ipv4']['address'] }}:6443 --disable=servicelb --write-kubeconfig-mode=644 --tls-san={{ floating_ip }} --node-ip={{ ansible_default_ipv4.address }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when:
    - inventory_hostname in groups['k3s_secondary']
    - not k3s_binary.stat.exists

- name: Wait for node to be Ready
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl wait --for=condition=Ready
    node/{{ inventory_hostname }} --timeout=180s
  changed_when: false
  when: inventory_hostname in groups['k3s_primary']
