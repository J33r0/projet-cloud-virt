---
- name: Install k3s on all cluster members
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k3s
      tags: [k3s]

- name: Install keepalived
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: keepalived
      tags: [keepalived, addons]

- name: Bootstrap the application (deploy.sh)
  hosts: k3s_primary
  become: true
  gather_facts: true
  roles:
    - role: app_bootstrap
      tags: [app]
