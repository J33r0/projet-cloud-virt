name: Build & Push API image

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/build-api.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required to push to GHCR and to attest the image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # sets up Docker Buildx so we can use cache-to/cache-from
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # generates tags such as:
      #   ghcr.io/j33r0/projet-cloud-virt/api:latest
      #   ghcr.io/j33r0/projet-cloud-virt/api:main
      #   ghcr.io/j33r0/projet-cloud-virt/api:sha-<short-sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./api          # Dockerfile lives in api/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache so layers are reused across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cryptographic attestation of the build provenance
      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          